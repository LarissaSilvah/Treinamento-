        const soundEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playClick() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            },
            playSuccess() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    gain.connect(this.ctx.destination);

                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.08));
                        osc.connect(gain);
                        osc.start(now + (idx * 0.08));
                        osc.stop(now + (idx * 0.08) + 0.12);
                    });
                } catch(e) {}
            },
            playAlert() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } catch(e) {}
            }
        };

                            value={userName}
                            onChange={(e) => setUserName(e.target.value)}
                            placeholder="Digite seu nome completo"
                            className="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-semibold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-corp-500 text-sm"
                        />
                    </div>

                    <div ref={certRef} className="printable-cert bg-white text-slate-900 p-8 sm:p-12 rounded-2xl shadow-2xl border-8 border-corp-900 relative overflow-hidden">
                        <div className="absolute right-[-50px] bottom-[-50px] opacity-5 pointer-events-none">
                            <i className="fa-solid fa-award text-[350px]"></i>
                        </div>

                        <div className="text-center space-y-6 relative z-10">
                            <div className="flex justify-center items-center space-x-3 mb-4">
                                <div className="w-12 h-12 bg-corp-900 text-white rounded-xl flex items-center justify-center text-2xl font-bold">
                                    <i className="fa-solid fa-building"></i>
                                </div>
                                <span className="font-extrabold text-2xl tracking-tight text-corp-900">EmpresaTech Corporativa</span>
                            </div>

                            <span className="text-xs font-bold uppercase tracking-widest text-slate-400 block">
                                Certificado Oficial de Conclusão e Qualificação
                            </span>

                            <h1 className="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">
                                CERTIFICADO DE EXCELÊNCIA
                            </h1>

                            <p className="text-sm text-slate-600">Certificamos que o colaborador(a)</p>

                            <div className="text-2xl sm:text-3xl font-extrabold text-corp-800 border-b-2 border-slate-300 pb-2 max-w-md mx-auto">
                                {userName.trim() || 'Seu Nome Aqui'}
                            </div>

                            <p className="text-xs sm:text-sm text-slate-600 max-w-2xl mx-auto leading-relaxed">
                                Concluiu com êxito os módulos avançados de simulação prática em <strong>Segurança da Informação, Gestão de Crise em Atendimento ao Cliente e Tomada de Decisão Executiva</strong> na plataforma CorpSim PRO.
                            </p>

                            <div className="grid grid-cols-3 gap-4 max-w-lg mx-auto pt-4 text-center">
                                <div className="p-2 bg-slate-50 rounded-lg border">
                                    <span className="block text-[10px] text-slate-400 uppercase font-bold">Pontuação XP</span>
                                    <span className="font-extrabold text-sm text-corp-600">{userXP} XP</span>
                                </div>
                                <div className="p-2 bg-slate-50 rounded-lg border">
                                    <span className="block text-[10px] text-slate-400 uppercase font-bold">Simulações</span>
                                    <span className="font-extrabold text-sm text-corp-600">3 de 3</span>
                                </div>
                                <div className="p-2 bg-slate-50 rounded-lg border">
                                    <span className="block text-[10px] text-slate-400 uppercase font-bold">Validação ID</span>
                                    <span className="font-extrabold text-[11px] text-slate-700">#CS-2026-98X</span>
                                </div>
                            </div>

                            <div className="pt-8 flex justify-between items-end border-t border-slate-200 mt-8 text-xs text-slate-500">
                                <div>
                                    <div className="font-bold text-slate-800">Diretoria de Treinamento & DHO</div>
                                    <div>EmpresaTech Corporate Education</div>
                                </div>
                                <div className="text-right">
                                    <div>Data da Emissão: {new Date().toLocaleDateString('pt-BR')}</div>
                                    <div className="text-[10px] text-emerald-600 font-bold">Assinado Digitalmente</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('hub');
            const [userXP, setUserXP] = useState(100);
            const [completedSims, setCompletedSims] = useState({
                phishing: false,
                dialogue: false,
                project: false
            });
            const [darkMode, setDarkMode] = useState(false);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const handleFinishSimulation = (simType, addedXP) => {
                if (!completedSims[simType]) {
                    setCompletedSims(prev => ({ ...prev, [simType]: true }));
                    setUserXP(prev => prev + addedXP);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar
                        activeTab={activeTab}
                        setActiveTab={setActiveTab}
                        userXP={userXP}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        {activeTab === 'hub' && (
                            <HubDashboard
                                onSelectSim={setActiveTab}
                                userXP={userXP}
                                completedSims={completedSims}
                            />
                        )}

                        {activeTab === 'phishing' && (
                            <PhishingSimulator onFinish={handleFinishSimulation} />
                        )}

                        {activeTab === 'dialogue' && (
                            <DialogueSimulator onFinish={handleFinishSimulation} />
                        )}

                        {activeTab === 'project' && (
                            <ProjectSimulator onFinish={handleFinishSimulation} />
                        )}

                        {activeTab === 'certificate' && (
                            <CertificateView userXP={userXP} completedSims={completedSims} />
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
